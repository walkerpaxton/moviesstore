<!DOCTYPE html>
<html>
<head>
    <title>Like Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="p-3">
        <div class="container">
            <div class="row mt-3">
                <div class="col mx-auto mb-3">
                    <hr />
                    <div class="mb-3">
                        <p class="text-muted">Total Likes: <strong>{{ template_data.like_count }}</strong></p>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="text-start">
                            <button type="submit" class="btn bg-dark text-white">
                                👍 Like
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>  
    </div>
</body>
</html>
