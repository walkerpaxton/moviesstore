{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Like Movie</h2>
        <hr />
        <form method="POST">
          {% csrf_token %}
          <p>
            <label for="like_status">Do you like this movie?</label>
            <select name="like_status" class="form-control" id="like_status">
              <option value="like">👍 Like</option>
              <option value="dislike">👎 Dislike</option>
              <option value="neutral">😐 Neutral</option>
            </select>
          </p>
          <div class="text-start">
            <button type="submit" class="btn bg-dark text-white">
              Submit Like
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>  
</div>
{% endblock content %}
